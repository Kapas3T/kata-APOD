<script>
const API_URL = 'https://science.nasa.gov/wp-json/wp/v2/apod-basic/?api_key=cwtgnChFmL9cQGpQMprjF9JGnmjpTdWGJcjNrMkM';

function extractIframe(html) {
  // [\s\S] also matches newlines, in case the iframe tag spans several lines
  const match = html.match(/<iframe[\s\S]*?<\/iframe>/i);
  return match ? match[0] : "";
}

function extractVideoSource(html) {
  const match = html.match(/src="([^"]*)"/i);
  return match ? match[1] : "";   // [1] = just the URL
}

async function main() {
  try {
    const res = await fetch(API_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    const html = data[4]?.basic_html ?? "";
    const iframe = extractIframe(html);
    const videoSrc = extractVideoSource(iframe);

    console.log(iframe);
    console.log(videoSrc);
    // use videoSrc here (e.g. set it on your own <iframe>)
  } catch (err) {
    console.error("Failed to load APOD:", err);
  }
}

main();
</script>
